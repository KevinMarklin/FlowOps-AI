services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flowops
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flowops"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://postgres:postgres@db:5432/flowops?sslmode=disable
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_GOOGLE_BASE_URL: ${AI_GOOGLE_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-gemini-3.8-flash}
    volumes:
      - ./knowledge_base:/app/knowledge_base

volumes:
  pgdata:
