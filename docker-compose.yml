services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flowops
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flowops"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8080"
      FLOWOPS_COOKIE_SECURE: ${FLOWOPS_COOKIE_SECURE:-false}
      FLOWOPS_BASELINE_MINUTES: ${FLOWOPS_BASELINE_MINUTES:-10}
      FLOWOPS_OPERATOR_TOKEN: ${FLOWOPS_OPERATOR_TOKEN:-}
      FLOWOPS_INGEST_TOKEN: ${FLOWOPS_INGEST_TOKEN:-}
      FLOWOPS_CALLBACK_URLS: ${FLOWOPS_CALLBACK_URLS:-}
      FLOWOPS_AI_PROVIDERS: ${FLOWOPS_AI_PROVIDERS:-}
      FLOWOPS_AI_ALLOW_FALLBACK: ${FLOWOPS_AI_ALLOW_FALLBACK:-false}
      FLOWOPS_AI_ALLOW_SENSITIVE: ${FLOWOPS_AI_ALLOW_SENSITIVE:-false}
      DATABASE_URL: postgres://postgres:postgres@db:5432/flowops?sslmode=disable
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      YANDEX_API_KEY: ${YANDEX_API_KEY:-}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
      YANDEX_MODEL: ${YANDEX_MODEL:-aliceai-llm}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_GOOGLE_BASE_URL: ${AI_GOOGLE_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_API_URL: ${MAX_API_URL:-https://platform-api2.max.ru}
      MAX_INSECURE_TLS: ${MAX_INSECURE_TLS:-false}
      MAIL_IMAP_HOST: ${MAIL_IMAP_HOST:-}
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    volumes:
      - ./knowledge_base:/app/knowledge_base

volumes:
  pgdata:
